name: tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install shapely numpy pymavlink pyserial
      - name: Run Python tests
        run: |
          python tests/test_core.py
          python tests/test_features.py
          python tests/test_serve.py
          python tests/test_bridge.py
          python tests/test_split.py
          python tests/test_ui.py
          python tests/test_gaps.py
          python tests/test_safe_transit.py
          python tests/test_api_safe_transit.py
          python tests/test_v24.py
          python tests/test_vio_home_upload.py
          python tests/test_upload_turn_radius.py
          python tests/test_sweep_regressions.py
          python tests/test_i18n_coverage.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS syntax + MAVLink/geometry tests
        run: |
          node --check web-stable/app.js
          node --check web-stable/vio-mode.js
          node --check web-stable/engine.js
          node --check web-stable/engine-worker.js
          node tests/test_jsmav.mjs
          node tests/test_geocover.mjs
          node tests/test_viomode.mjs
          node tests/test_jsfence.mjs
          node tests/test_boot.mjs
          node tests/test_report.mjs
          node tests/test_relay.mjs
          node tests/test_collector.mjs
          node tests/test_i18n.mjs
